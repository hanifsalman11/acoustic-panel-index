name: Autonomous Room Acoustics RT60 & MLV Soundproofing Engine

on:
  schedule:
    - cron: '09 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_acoustic:
        description: 'Optional Room Size or Material (e.g. 14x18 Home Theater or Owens Corning 703)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-acoustic-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Acoustic Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_ACOUSTIC: ${{ github.event.inputs.custom_acoustic || '' }}
        run: |
          python engine/acoustic_builder.py

      - name: Self-Healing Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_acoustics.json
          if git diff --staged --quiet; then
            echo "No new acoustic calculator pages to commit."
          else
            git commit -m "chore(acoustics): auto-publish new Sabine RT60 panel & MLV calculators"
            for i in 1 2 3; do
              git pull --rebase origin main || true
              if git push origin main; then
                echo "Pushed successfully on attempt $i"
                break
              fi
              sleep 5
            done
          fi
